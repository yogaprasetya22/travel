services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────
  db:
    container_name: travel-db-prod
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-travel}
      POSTGRES_USER: ${DB_USERNAME:-travel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TravelProd!2025#Secure}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - travel_postgres_data:/var/lib/postgresql/data
    networks:
      - travel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-travel} -d ${DB_DATABASE:-travel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel App (PHP-FPM + Queue + Scheduler) ─────────────────
  app:
    container_name: travel-app-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./:/var/www/html
      - travel_vendor_data:/var/www/html/vendor
      - travel_app_storage:/var/www/html/storage/app
      - travel_app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travel_net
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx ─────────────────────────────────────────────────────
  nginx:
    container_name: travel-nginx-prod
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - travel_app_logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - travel_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Redis (Cache & Queue backend) ─────────────────────────────
  redis:
    container_name: travel-redis-prod
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - travel_redis_data:/data
    networks:
      - travel_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  travel_postgres_data:
  travel_redis_data:
  travel_vendor_data:
  travel_app_storage:
  travel_app_logs:

networks:
  travel_net:
    driver: bridge
